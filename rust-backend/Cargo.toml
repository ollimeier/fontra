[package]
name = "fontra-backend-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "fontra_backend_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
# Note: fontations is not yet available on crates.io
# We'll use skrifa which is part of the fontations project
read-fonts = "0.22"
skrifa = "0.22"
write-fonts = "0.22"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
csv = "1.3"
notify = "6.1"
pythonize = "0.22"
